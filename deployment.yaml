apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-backend
  namespace: sentiment-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: sentiment-backend

  template:
    metadata:
      labels:
        app: sentiment-backend

    spec:
      nodeSelector:
        role: backend

      containers:
        - name: sentiment-backend
          image: 487620625686.dkr.ecr.eu-north-1.amazonaws.com/sentiment-backend:5

          ports:
            - containerPort: 8000

          env:
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: FRONTEND_URL

            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: NEWS_API_KEY

      imagePullSecrets:
        - name: ecr-secret