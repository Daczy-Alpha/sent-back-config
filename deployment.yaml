apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-sqlite-pvc
  namespace: sentiment-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-backend-api
  namespace: sentiment-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: sentiment-backend-api

  template:
    metadata:
      labels:
        app: sentiment-backend-api

    spec:
      nodeSelector:
        role: backend

      containers:
        - name: sentiment-backend-api
          image: 487620625686.dkr.ecr.eu-north-1.amazonaws.com/sentiment-backend:11
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: FRONTEND_URL

          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"

      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: backend-sqlite-pvc

      imagePullSecrets:
        - name: ecr-secret

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-backend-scheduler
  namespace: sentiment-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: sentiment-backend-scheduler

  template:
    metadata:
      labels:
        app: sentiment-backend-scheduler

    spec:
      nodeSelector:
        role: backend

      containers:
        - name: sentiment-backend-scheduler
          image: 487620625686.dkr.ecr.eu-north-1.amazonaws.com/sentiment-backend:11
          imagePullPolicy: IfNotPresent

          command: ["python", "scheduler.py"]

          env:
            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: NEWS_API_KEY

          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2"

      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: backend-sqlite-pvc

      imagePullSecrets:
        - name: ecr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-backend-service
  namespace: sentiment-app
spec:
  type: NodePort

  selector:
    app: sentiment-backend-api

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
      protocol: TCP
